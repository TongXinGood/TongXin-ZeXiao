# 考研择校：静态数据接口（被 /etc/nginx/sites-available/default 引用）
# 网址 /kaoyan/api/... 对应仓库里的 /var/www/kaoyan/dist/api/...
# 只放行 .json 和图片，仓库里其他文件一律访问不到

# JSON：每次都向服务器确认是否有更新（小程序自己按版本号做缓存）
location ~ ^/kaoyan/api/(.+\.json)$ {
    alias /var/www/kaoyan/dist/api/$1;
    default_type application/json;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
}

# 图片：浏览器 / 小程序缓存 7 天
location ~ ^/kaoyan/api/(.+\.(?:jpg|jpeg|png|webp))$ {
    alias /var/www/kaoyan/dist/api/$1;
    expires 7d;
}
